---
name: Create Boutiques descriptor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  create-descriptor:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install package
      run: |
        pip install -U pip
        pip install .

    - name: Create descriptor
      uses: michellewang/argparse-to-boutiques@98418399172001bf4935557f1a6a8d75300a2c82
      with:
        parser-type: argparse
        parser-location: my_tool.cli:get_parser
        output-path: my_tool/data/descriptor.json
        token: ${{ secrets.PAT }}
        open-pr: true
