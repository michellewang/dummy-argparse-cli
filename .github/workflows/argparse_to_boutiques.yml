---
name: Create Boutiques descriptor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  create-descriptor:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: Install package
      run: |
        pip install -U pip
        pip install .

    - name: Create descriptor for dummy-cli
      uses: michellewang/argparse-to-boutiques@98418399172001bf4935557f1a6a8d75300a2c82
      with:
        parser-type: argparse
        parser-location: my_tool.cli:get_parser
        output-path: my_tool/data/descriptor-dummy-cli.json
        updates-file: descriptor_updates.json
        token: ${{ secrets.PAT }}
        exclude-version: true
        open-pr: true

    - name: Create descriptor for dummy-cli-click
      uses: michellewang/argparse-to-boutiques@98418399172001bf4935557f1a6a8d75300a2c82
      with:
        parser-type: click
        parser-location: my_tool.cli_click:main
        output-path: my_tool/data/descriptor-dummy-cli-click.json
        token: ${{ secrets.PAT }}
        exclude-version: true
        open-pr: true

    - name: Create descriptor for dummy-cli-click-group
      uses: michellewang/argparse-to-boutiques@98418399172001bf4935557f1a6a8d75300a2c82
      with:
        parser-type: click
        parser-location: my_tool.cli_click_group:group
        output-path: my_tool/data/descriptor-dummy-cli-click-group.json
        token: ${{ secrets.PAT }}
        exclude-version: true
        open-pr: true
