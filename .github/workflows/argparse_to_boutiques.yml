---
name: Create Boutiques descriptor

on:
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6

    - name: Install package
      run: |
        pip install -U pip
        pip install .

    - name: Create descriptor
      uses: michellewang/argparse-to-boutiques@v0
      with:
        parser-location: my_tool.cli:get_parser
        output-path: my_tool/data/descriptor.json
