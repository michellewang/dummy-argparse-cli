---
name: Create Boutiques descriptor

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  create-descriptor:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6

    - name: Install package
      run: |
        pip install -U pip
        pip install .

    - name: Create descriptor
      uses: michellewang/argparse-to-boutiques@018d3828772361b939599554317f7e11dc5c5a8f
      with:
        parser-type: argparse
        parser-location: my_tool.cli:get_parser
        output-path: my_tool/data/descriptor.json
        updates-file: descriptor_updates.json
        token: ${{ secrets.PAT }}
        open-pr: false
